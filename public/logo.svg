<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb6c00" />
      <stop offset="100%" stop-color="#e05300" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c33" />
      <stop offset="100%" stop-color="#fb6c00" />
    </linearGradient>
  </defs>

  <!-- Brand Emblem / Icon -->
  <g transform="translate(10, 10)">
    <!-- Base Shape -->
    <rect x="0" y="0" width="70" height="70" rx="18" fill="url(#primaryGrad)" />
    <!-- Modern Soundwave / Visualizer Bars -->
    <rect x="16" y="27" width="6" height="16" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="26" y="18" width="6" height="34" rx="3" fill="#ffffff" />
    <rect x="36" y="12" width="6" height="46" rx="3" fill="#ffffff" />
    <rect x="46" y="22" width="6" height="26" rx="3" fill="#ffffff" opacity="0.9" />
    <!-- Subtle shine accent -->
    <circle cx="56" cy="14" r="3" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(96, 0)">
    <!-- Name -->
    <text x="0" y="42" font-family="'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="-0.5">
      Nikhil Kumar S
    </text>
    <!-- Subtitle / Tagline -->
    <text x="0" y="68" font-family="'Google Sans', 'Product Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="600" fill="#fb6c00" letter-spacing="0.2">
      Visualizer
    </text>
  </g>
</svg>
